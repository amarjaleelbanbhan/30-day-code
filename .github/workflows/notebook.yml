name: notebook

on:
  push:
    paths: ["notebook/**", ".github/workflows/notebook.yml"]
  pull_request:
    paths: ["notebook/**", ".github/workflows/notebook.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notebook
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nb
          POSTGRES_PASSWORD: nb
          POSTGRES_DB: notebook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nb" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://nb:nb@localhost:5432/notebook_test
      DATABASE_URL: postgres://nb:nb@localhost:5432/notebook_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notebook/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
